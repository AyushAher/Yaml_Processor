name: Build and Release

on:
  push:
    tags:
      - "v*.*.*"  # Trigger on version tags like v1.0.0

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.os }}-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}

    strategy:
      matrix:
        include:
          - os: linux
            arch: amd64
            runner: ubuntu-latest
            python_arch: x64

          - os: linux
            arch: arm64
            runner: ubuntu-24.04-arm
            python_arch: arm64

          - os: windows
            arch: amd64
            runner: windows-latest
            python_arch: x64

          - os: windows
            arch: arm64
            runner: windows-11-arm
            python_arch: arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          architecture: ${{ matrix.python_arch }}

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build binary
        run: |
          pyinstaller --onefile cli.py --name yaml-runner

      - name: Rename binary (Linux)
        if: matrix.os == 'linux'
        run: |
          mv dist/yaml-runner yaml-runner-${{ matrix.os }}-${{ matrix.arch }}

      - name: Rename binary (Windows)
        if: matrix.os == 'windows'
        run: |
          move dist\yaml-runner.exe yaml-runner-${{ matrix.os }}-${{ matrix.arch }}.exe

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: yaml-runner-${{ matrix.os }}-${{ matrix.arch }}
          path: yaml-runner-${{ matrix.os }}-${{ matrix.arch }}*
          
  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4

      - name: Prepare release files
        run: |
          mkdir release
          cp */* release/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}